server {
  listen 80;
  server_name mona.fiehnlab.ucdavis.edu;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name mona.fiehnlab.ucdavis.edu;
  server_tokens off;

  ssl_certificate /usr/share/nginx/certificates/mona.fiehnlab.ucdavis.edu/fullchain.pem;
  ssl_certificate_key /usr/share/nginx/certificates/mona.fiehnlab.ucdavis.edu/privkey.pem;
#  ssl_trusted_certificate /usr/share/nginx/certificates/mona.fiehnlab.ucdavis.edu/chain.pem;

  include /etc/ssl-options/options-nginx-ssl.conf;
  ssl_dhparam /etc/ssl-options/ssl-dhparams.pem;

  location / {
    # Manual maintenance toggle, checked live on every request (no reload needed)
    # See scripts/maintenance_mode.sh
    if (-f /etc/nginx/maintenance/maintenance.flag) {
      return 503;
    }

    # Serves the maintenance page for the manual flag above (503) and for the
    # window where proxy_pass can't reach the backend during a restart (502/504)
    proxy_intercept_errors on;
    error_page 502 503 504 /maintenance.html;

    proxy_pass          http://128.120.143.183:8080;
    proxy_set_header    Host                $http_host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_max_temp_file_size 0;
    # Matches the 32MB multipart limit in download-scheduler's application.yml, comfortably over
    # the 8MB chunked upload size, so nginx's 1MB default never rejects a chunk before it lands
    client_max_body_size 32m;

    # CORS
    # https://serverfault.com/a/844963
    # https://serverfault.com/a/979627
#    add_header 'Access-Control-Allow-Origin' '*' always;

    # Simple requests
    if ($request_method ~* "(GET|POST)") {
      #add_header "Access-Control-Allow-Origin"  *;
    }

    # Preflighted requests
    if ($request_method = OPTIONS ) {
      add_header "Access-Control-Allow-Origin"  *;
      add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, HEAD";
      add_header "Access-Control-Allow-Headers" "Authorization, Origin, X-Requested-With, Content-Type, Accept";
      return 204;
    }
  }

  location = /maintenance.html {
    internal;
    root /etc/nginx/maintenance;
  }
}
