<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a3e68">
<title>MoNA - Undergoing Maintenance</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background-color: #F9F4E5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #232222;
  }

  .navbar {
    padding: 0.85rem 1.25rem;
    background-color: #1a3e68;
    border-bottom: 5px solid #FFBF00;
  }

  .navbar span {
    color: #FFBF00;
    font-size: x-large;
    font-weight: bold;
  }

  .content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    max-width: 32rem;
    margin: 1.5rem;
    padding: 2.5rem 2.5rem 2rem;
    background-color: #ffffff;
    border-top: 5px solid #FFBF00;
    border-radius: 6px;
    box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.12);
    text-align: center;
  }

  h1 {
    margin: 0 0 0.75rem;
    font-family: "Garamond,Baskerville,Baskerville Old Face,Hoefler Text,Times New Roman,serif";
    color: #022851;
    font-size: 1.75rem;
    font-weight: bold;
  }

  p {
    margin: 0.5rem 0;
    font-size: 1.05rem;
    line-height: 1.5;
  }

  .subtext {
    color: #6A7077;
    font-size: 0.95rem;
  }

  .subtext a {
    color: #0b3f6c;
  }

  .subtext a:hover {
    color: #276db3;
  }
</style>
</head>
<body>
  <div class="navbar">
    <span>MoNA - MassBank of North America</span>
  </div>
  <div class="content">
    <div class="card">
      <h1>MoNA is undergoing maintenance</h1>
      <p>We're performing some routine updates. Please check back soon.</p>
      <p class="subtext">If this has been going on for more than a day, please contact
        <a href="mailto:mona.contact.fiehnlab@gmail.com">mona.contact.fiehnlab@gmail.com</a>
        or report it to the <a href="https://github.com/metabolomics-us/mona/issues" target="_blank">issue tracker</a>.</p>
      <br>
      <p class="subtext">MassBank of North America</p>
    </div>
  </div>
</body>
</html>
