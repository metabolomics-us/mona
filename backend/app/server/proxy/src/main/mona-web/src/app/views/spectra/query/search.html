<h1 class="h2"><fa-icon [icon]="faSearch"></fa-icon> Search Spectra</h1>
<div id="search-box">
    <ul ngbNav #nav="ngbNav" class="nav-tabs">
        <li ngbNavItem role="presentation">
            <a ngbNavLink class="davis-blue" style="min-height: 44px;">Quick Search</a>
            <ng-template ngbNavContent>
                <keyword-search-form></keyword-search-form>
            </ng-template>
        </li>
        <li ngbNavItem role="presentation">
            <a ngbNavLink class="davis-blue" style="min-height: 44px;">Similarity Search</a>
            <ng-template ngbNavContent>
                <similarity-search-form></similarity-search-form>
            </ng-template>
        </li>
    </ul>
    <div [ngbNavOutlet]="nav">
    </div>
</div>
