<div class="row">
    <div class="col-md-12">
      <br>
      <h1 class="h2">Common Terms Used Throughout MoNA</h1>
      <hr>
      <br>
      <!--OrderBy -->
        <div *ngFor="let term of terms">
          <div class="list-group">
            <h2 class="h4 list-group-item-heading">{{term.name}}</h2>
            <p class="list-group-item-text">
                {{term.info}}
            </p>
          </div>
          <br/>
        </div>
    </div>
</div>
