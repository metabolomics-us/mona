<ul class="nav navbar-nav navbar-top-links navbar-right">
    <!-- User Login -->
    <li class="dropdown" ngbDropdown>
        <button class="dropdown-toggle" ngbDropdownToggle aria-label="User menu">
          <fa-icon [icon]="faUser"></fa-icon>
        </button>
        <ul class="uib-dropdown-menu dropdown-user" ngbDropdownMenu>
            <li *ngIf="isLoggedIn()">
              <a ngbDropdownItem data-toggle="collapse" data-target=".navbar-collapse.show" [routerLink]="['/profile']"><fa-icon [icon]="faUser"></fa-icon> User Profile</a>
            </li>
            <li *ngIf="isLoggedIn()" class="divider"></li>

            <li>
              <button ngbDropdownItem data-toggle="collapse" data-target=".navbar-collapse.show" (click)="handleLogin()"><fa-icon [icon]="faSignOutAlt"></fa-icon> {{isLoggedIn() ?
                    "Log Out" : "Log In"}}</button>
            </li>
            <li *ngIf="!isLoggedIn()">
              <button ngbDropdownItem data-toggle="collapse" data-target=".navbar-collapse.show" (click)="handleRegistration()"><fa-icon [icon]="faUsers"></fa-icon> Register</button>
            </li>
        </ul>
        <!-- /.dropdown-user -->
    </li>
</ul>
